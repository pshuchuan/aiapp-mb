<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aiapp-mb · AI 原生通用跨平台应用市场</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #22262f;
    --border: #2c313c;
    --text: #e8eaed;
    --muted: #9aa0aa;
    --accent: #4f8cff;
    --accent-2: #6ea8ff;
    --ok: #34c759;
    --err: #ff5c5c;
    --tag-bg: #1e2a3a;
    --tag-border: #2c3d55;
    --overlay: rgba(0,0,0,0.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 24px; background: var(--panel);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
    flex-wrap: wrap;
  }
  .topbar .logo {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #6ea8ff, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    cursor: pointer; white-space: nowrap;
  }
  .topbar .logo small { font-size: 12px; -webkit-text-fill-color: var(--muted); }
  .topbar-left { display: flex; align-items: center; gap: 18px; }
  .nav-tabs { display: flex; gap: 6px; }
  .nav-tab {
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 16px; font-size: 13px; color: var(--muted); cursor: pointer;
    transition: all .15s;
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .topbar-right { display: flex; gap: 10px; align-items: center; }
  .topbar .gen-toggle {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s; white-space: nowrap;
  }
  .topbar .gen-toggle:hover { background: var(--accent-2); }
  .topbar .gen-toggle.on { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .topbar .stats { font-size: 13px; color: var(--muted); }

  /* ===== 生成器抽屉 ===== */
  .gen-drawer {
    display: none; background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 20px 24px; position: sticky; top: 52px; z-index: 49;
  }
  .gen-drawer.show { display: block; }
  .gen-drawer .mode-switch { display: flex; gap: 6px; margin-bottom: 12px; }
  .gen-drawer .mode-btn {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 16px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .gen-drawer .mode-btn:hover { color: var(--text); }
  .gen-drawer .mode-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .gen-drawer .update-target {
    display: flex; gap: 10px; align-items: center; margin-bottom: 12px;
    padding: 10px 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; color: var(--muted);
  }
  .gen-drawer .update-target select {
    flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none;
  }
  .gen-drawer textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; font-family: inherit;
    outline: none; min-height: 70px; resize: vertical;
  }
  .gen-drawer textarea:focus { border-color: var(--accent); }
  .gen-drawer .gen-row {
    display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap;
  }
  .gen-drawer .tpl-mini { display: flex; gap: 6px; flex-wrap: wrap; }
  .tpl-mini-btn {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .tpl-mini-btn:hover { border-color: var(--muted); }
  .tpl-mini-btn.on { border-color: var(--accent); color: var(--accent-2); }
  .gen-drawer .gen-submit {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    margin-left: auto;
  }
  .gen-drawer .gen-submit:hover { background: var(--accent-2); }
  .gen-drawer .gen-submit:disabled { opacity: .5; cursor: not-allowed; }
  .gen-drawer .gen-result { margin-top: 10px; font-size: 13px; color: var(--muted); line-height: 1.7; }
  .gen-result .res-actions { display: flex; gap: 8px; margin-top: 8px; }
  .gen-result .res-btn {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 14px; font-size: 12px; color: var(--text); cursor: pointer; transition: all .15s;
  }
  .gen-result .res-btn:hover { border-color: var(--accent); }
  .gen-result .res-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ===== 主页 ===== */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 80px; }

  .avail-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .avail-switch { display: flex; gap: 6px; align-items: center; }
  .avail-btn {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 18px; font-size: 13px;
    color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .avail-btn:hover { border-color: var(--muted); color: var(--text); }
  .avail-btn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .avail-btn.on.warn { background: #8a5a00; border-color: #b8860b; color: #ffe08a; }
  .current-device {
    font-size: 12px; color: var(--muted); margin-left: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .current-device .dev-badge {
    background: var(--tag-bg); color: var(--accent-2);
    border: 1px solid var(--tag-border); border-radius: 4px; padding: 2px 8px;
    font-size: 11px;
  }
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .filter-bar .label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .filter-chip {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px; font-size: 12px;
    color: var(--muted); cursor: pointer; transition: all .15s;
    user-select: none;
  }
  .filter-chip:hover { border-color: var(--muted); color: var(--text); }
  .filter-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-chip.tag { border-radius: 4px; }

  .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 1100px) { .app-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) { .app-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .app-grid { grid-template-columns: 1fr; } }
  .app-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .app-card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .app-card .app-thumb {
    width: 100%; height: 120px; object-fit: cover; display: block;
    background: linear-gradient(135deg, #1a1d24 0%, #2a2d38 100%);
  }
  .app-card .app-body { padding: 14px; }
  .app-card .app-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .app-card .app-name .not-sup { font-size: 13px; }
  .vis-badge {
    font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 7px;
  }
  .vis-badge.private { background: #3a2f12; color: #ffd166; border: 1px solid #8a6a1f; }
  .vis-badge.public { background: #123a2f; color: #4ade80; border: 1px solid #1f8a6a; }
  .ver-badge {
    font-size: 10px; font-weight: 600; border-radius: 4px; padding: 1px 7px;
    background: var(--panel-2); color: var(--muted); border: 1px solid var(--border);
  }
  .app-card .app-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  .app-card .app-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .app-tag {
    font-size: 11px; background: var(--tag-bg); color: var(--accent-2);
    border: 1px solid var(--tag-border); border-radius: 4px; padding: 2px 7px;
  }
  .app-card .app-platforms { display: flex; gap: 4px; flex-wrap: wrap; }
  .plat-badge {
    font-size: 11px; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px;
  }
  /* 我的应用卡片操作按钮 */
  .my-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .my-btn {
    flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 7px; padding: 6px 6px; font-size: 12px; color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .my-btn:hover { border-color: var(--accent); color: var(--text); }
  .my-btn.publish { background: var(--accent); border-color: var(--accent); color: #fff; }
  .my-btn.danger:hover { border-color: var(--err); color: var(--err); }
  .market-empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted); }
  .market-empty .big { font-size: 40px; margin-bottom: 12px; }
  .market-empty p { font-size: 14px; line-height: 1.6; }

  .sec-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .sec-title .sub { font-size: 12px; color: var(--muted); font-weight: 400; }

  /* ===== 应用窗口 ===== */
  .app-window {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: var(--overlay); backdrop-filter: blur(4px);
  }
  .app-window.show { display: flex; align-items: center; justify-content: center; }
  .app-window .window-frame {
    width: 90%; max-width: 680px; max-height: 85vh;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: windowIn .2s ease;
  }
  @keyframes windowIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .app-window .window-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .app-window .window-titlebar .win-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .app-window .window-titlebar .win-name { font-size: 15px; font-weight: 700; }
  .app-window .window-titlebar .win-platforms { display: flex; gap: 4px; }
  .app-window .window-titlebar .win-actions { display: flex; gap: 8px; }
  .win-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .win-btn:hover { background: var(--panel-2); color: var(--text); }
  .win-btn.close:hover { background: #e81123; color: #fff; border-color: #e81123; }
  .app-window .window-body { flex: 1; overflow: auto; padding: 20px; min-height: 300px; }
  .app-window .mock-content {
    font-family: "SF Mono", Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 1.6; white-space: pre; color: var(--text);
    background: #0a0c10; border-radius: 10px; padding: 20px;
  }
  .app-window .window-owner {
    display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted);
    border-top: 1px solid var(--border); padding: 10px 18px; background: var(--panel);
  }
  .app-window .window-source {
    border-top: 1px solid var(--border); padding: 14px 18px; background: var(--panel-2);
  }
  .app-window .window-source .custom-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .app-window .custom-btns { display: flex; gap: 8px; align-items: center; }
  .app-window .custom-gen {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .app-window .custom-gen:hover { background: var(--accent-2); }
  .app-window .report-btn {
    font-size: 12px; color: var(--muted); cursor: pointer;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; transition: all .15s;
  }
  .app-window .report-btn:hover { border-color: var(--err); color: var(--err); }

  /* ===== 任务栏 ===== */
  .taskbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 6px 16px; display: none; gap: 6px; align-items: center;
  }
  .taskbar.show { display: flex; }
  .taskbar .task-label { font-size: 11px; color: var(--muted); margin-right: 6px; }
  .task-icon {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
    font-size: 12px; transition: all .15s;
  }
  .task-icon:hover { border-color: var(--accent); }
  .task-icon .task-close {
    font-size: 14px; color: var(--muted); margin-left: 4px;
    width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
  }
  .task-icon .task-close:hover { background: #e81123; color: #fff; }

  /* ===== 发布弹窗 ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: var(--overlay); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    width: 92%; max-width: 440px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 16px; padding: 24px;
    animation: windowIn .2s ease;
  }
  .modal h3 { font-size: 18px; margin-bottom: 4px; }
  .modal .modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 18px; }
  .modal label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 6px; }
  .modal input, .modal textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
    font-size: 14px; font-family: inherit; outline: none;
  }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent); }
  .modal textarea { min-height: 60px; resize: vertical; }
  .modal .modal-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .modal .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal .m-btn {
    padding: 9px 20px; border-radius: 8px; font-size: 14px; cursor: pointer;
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    transition: all .15s;
  }
  .modal .m-btn:hover { border-color: var(--muted); }
  .modal .m-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .modal .m-btn.primary:hover { background: var(--accent-2); }

  /* ===== 后台管理 ===== */
  .admin-layout { display: flex; gap: 20px; align-items: flex-start; }
  .admin-menu {
    width: 210px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 8px; position: sticky; top: 70px;
    flex-shrink: 0;
  }
  .admin-menu-item {
    display: block; width: 100%; text-align: left; background: transparent;
    border: none; border-radius: 8px; padding: 10px 14px; font-size: 13px;
    color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .admin-menu-item:hover { color: var(--text); background: var(--panel-2); }
  .admin-menu-item.on { background: var(--accent); color: #fff; }
  .admin-panel { flex: 1; min-width: 0; }
  .admin-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 16px;
  }
  .admin-card h3 { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .admin-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat-card {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; text-align: center;
  }
  .stat-card .num { font-size: 26px; font-weight: 800; color: var(--accent-2); }
  .stat-card .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .admin-table th, .admin-table td {
    text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .admin-table th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  .admin-table tr:hover td { background: var(--panel-2); }
  .a-badge {
    display: inline-block; font-size: 11px; border-radius: 4px;
    padding: 2px 8px; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border);
  }
  .a-badge.published { background: #123a2f; color: #4ade80; border-color: #1f8a6a; }
  .a-badge.reviewing { background: #3a3412; color: #ffd166; border-color: #8a6a1f; }
  .a-badge.draft { background: #2a2d38; color: #b9bfc9; border-color: var(--border); }
  .a-badge.disabled { background: #3a1220; color: #ff8a8a; border-color: #8a1f35; }
  .a-badge.active { background: #123a2f; color: #4ade80; border-color: #1f8a6a; }
  .a-badge.admin { background: #1e2a3a; color: #6ea8ff; border-color: #2c3d55; }
  .admin-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .small-btn {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; color: var(--text); cursor: pointer; transition: all .15s;
  }
  .small-btn:hover { border-color: var(--accent); }
  .small-btn.ok { border-color: #1f8a6a; color: #4ade80; }
  .small-btn.warn { border-color: #8a6a1f; color: #ffd166; }
  .small-btn.danger { border-color: #8a1f35; color: #ff8a8a; }
  .small-btn.danger:hover { background: #3a1220; }
  .a-note { font-size: 11px; color: var(--muted); }
  .prompt-box { width: 100%; min-height: 320px; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
    font-family: "SF Mono", Consolas, monospace; font-size: 13px; line-height: 1.6; outline: none; }
  .prompt-box:focus { border-color: var(--accent); }
  .prompt-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }

  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; line-height: 1.8; }
</style>
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<div class="topbar">
  <div class="topbar-left">
    <div class="logo" onclick="closeAllWindows(); closeGenerator()">aiapp&#8209;mb <small>· AI 原生</small></div>
    <div class="nav-tabs" id="navTabs">
      <span class="nav-tab on" data-view="market">🛍 应用市场</span>
      <span class="nav-tab" data-view="myapps">👤 我的应用</span>
      <span class="nav-tab" data-view="admin">🛠 管理后台</span>
    </div>
  </div>
  <div class="topbar-right">
    <span class="stats" id="marketCount"></span>
    <button class="gen-toggle" id="genToggle" onclick="toggleGenerator()">✨ 生成新应用</button>
  </div>
</div>

<!-- ===== 生成器抽屉 ===== -->
<div class="gen-drawer" id="genDrawer">
  <div class="mode-switch">
    <button class="mode-btn on" data-mode="new" onclick="setMode('new')">🆕 新建应用</button>
    <button class="mode-btn" data-mode="update" onclick="setMode('update')">🔄 更新应用</button>
  </div>
  <div class="update-target" id="updateTarget" hidden>
    <span>要更新的应用：</span>
    <select id="updateSelect"></select>
  </div>
  <textarea id="descInput" placeholder="描述你想要的应用，比如：做一个统计本月到账金额的小工具，按日期汇总"></textarea>
  <div class="gen-row">
    <div class="tpl-mini" id="tplMini"></div>
    <button class="gen-submit" id="genSubmit" onclick="generateApp()">✨ 生成</button>
  </div>
  <div class="gen-result" id="genResult"></div>
</div>

<!-- ===== 主页容器 ===== -->
<div class="wrap">
  <!-- 应用市场视图 -->
  <div id="viewMarket">
    <div class="avail-bar" id="availBar"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="app-grid" id="marketGrid"></div>
  </div>
  <!-- 我的应用视图 -->
  <div id="viewMyApps" hidden>
    <div class="sec-title">👤 我的应用 <span class="sub">我拥有的应用，可先自己使用；发布到市场需填写基础信息</span></div>
    <div class="app-grid" id="myGrid"></div>
  </div>
  <!-- 管理后台视图 -->
  <div id="viewAdmin" hidden>
    <div class="admin-layout">
      <div class="admin-menu" id="adminMenu">
        <button class="admin-menu-item on" data-panel="stats">📊 使用统计</button>
        <button class="admin-menu-item" data-panel="apps">📦 应用管理</button>
        <button class="admin-menu-item" data-panel="users">👥 用户管理</button>
        <button class="admin-menu-item" data-panel="prompt">🤖 生成提示词</button>
      </div>
      <div class="admin-panel">
        <!-- 统计 -->
        <div id="panelStats"></div>
        <!-- 应用管理 -->
        <div id="panelApps" hidden></div>
        <!-- 用户管理 -->
        <div id="panelUsers" hidden></div>
        <!-- 提示词迭代 -->
        <div id="panelPrompt" hidden></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== 应用窗口 ===== -->
<div class="app-window" id="appWindow">
  <div class="window-frame">
    <div class="window-titlebar">
      <div class="win-info">
        <span class="win-name" id="winName"></span>
        <span class="ver-badge" id="winVersion"></span>
        <span class="win-platforms" id="winPlatforms"></span>
      </div>
      <div class="win-actions">
        <button class="win-btn" onclick="minimizeApp()" title="最小化到后台">─</button>
        <button class="win-btn close" onclick="closeApp()" title="关闭应用">✕</button>
      </div>
    </div>
    <div class="window-body" id="winBody"></div>
    <div class="window-owner" id="winOwner"></div>
    <div class="window-source">
      <div class="custom-row">
        <div class="custom-btns" id="winActionBtns"></div>
        <button class="report-btn" onclick="reportApp()">举报</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== 任务栏 ===== -->
<div class="taskbar" id="taskbar">
  <span class="task-label">📌 后台运行</span>
  <div id="taskIcons"></div>
</div>

<!-- ===== 发布弹窗 ===== -->
<div class="modal-overlay" id="pubModal">
  <div class="modal">
    <h3>🚀 发布到应用市场</h3>
    <div class="modal-sub">填写基础信息后，你的应用将对其他用户可见</div>
    <label>应用名称 *</label>
    <input id="pubName" placeholder="给应用起个好名字">
    <label>应用描述</label>
    <textarea id="pubDesc" placeholder="用一句话说明这个应用是做什么的"></textarea>
    <label>标签（用中文逗号或英文逗号分隔）</label>
    <input id="pubTags" placeholder="实用工具, 办公效率">
    <label>支持平台（用逗号分隔）</label>
    <input id="pubPlatforms" placeholder="网页, 手机, macOS, Windows, 鸿蒙, 车机, 电视盒">
    <div class="modal-hint">标签和平台留空则不填写，发布后可在市场中筛选</div>
    <div class="modal-actions">
      <button class="m-btn" onclick="closePublish()">取消</button>
      <button class="m-btn primary" onclick="confirmPublish()">发布</button>
    </div>
  </div>
</div>

<div class="footer">
  aiapp-mb · AI 原生应用，一份代码，通用跨平台运行
</div>

<script>
// ====== 状态 ======
let templates = [];
let marketApps = [];       // 公开市场应用
let myApps = [];           // 我的应用（owner = me）
let availFilter = '可用';   // 市场可用性过滤 '可用' | '不可用'
let tagFilter = '全部';
let currentPlatforms = []; // 自动侦测的当前平台
let currentView = 'market'; // 'market' | 'myapps'
let currentAppId = null;
let backgroundApps = [];
let genMode = 'new';       // 'new' | 'update'
let pendingApp = null;     // 最近一次生成的应用
let currentAdminPanel = 'stats'; // 后台当前子面板
let adminUsers = [];
let adminApps = [];
let adminStats = null;

const $ = id => document.getElementById(id);

// ====== 自动侦测当前平台 ======
function detectPlatforms() {
  const ua = navigator.userAgent;
  const isMobile = /Mobi|Android|iPhone|iPad|HarmonyOS/i.test(ua);
  const w = window.innerWidth;
  const platforms = [];
  if (isMobile) {
    platforms.push('手机');
  } else if (w >= 1024) {
    platforms.push('电脑', '笔记本');
  } else {
    platforms.push('平板');
  }
  platforms.push('网页');
  if (/Macintosh|Mac OS/i.test(ua)) platforms.push('macOS');
  if (/Windows/i.test(ua)) platforms.push('Windows');
  if (/HarmonyOS|鸿蒙/i.test(ua)) platforms.push('鸿蒙');
  return [...new Set(platforms)];
}

function supportsCurrent(a) {
  return (a.platforms || []).some(p => currentPlatforms.includes(p));
}

// ====== 视图切换 ======
function setView(view) {
  currentView = view;
  $('viewMarket').hidden = view !== 'market';
  $('viewMyApps').hidden = view !== 'myapps';
  $('viewAdmin').hidden = view !== 'admin';
  document.querySelectorAll('.nav-tab').forEach(t =>
    t.classList.toggle('on', t.dataset.view === view));
  if (view === 'myapps') { loadMyApps(); renderMyApps(); }
  if (view === 'admin') { loadAdminPanel(currentAdminPanel); }
}

// ====== 生成器 ======
function toggleGenerator() {
  const d = $('genDrawer'), t = $('genToggle');
  d.classList.contains('show') ? closeGenerator() : openGenerator();
}

function openGenerator() {
  $('genDrawer').classList.add('show');
  $('genToggle').classList.add('on');
  $('genToggle').textContent = '收起';
  $('genResult').innerHTML = '';
  loadTplMini();
  refreshUpdateSelect();
}

function closeGenerator() {
  $('genDrawer').classList.remove('show');
  $('genToggle').classList.remove('on');
  $('genToggle').textContent = '✨ 生成新应用';
}

function setMode(mode) {
  genMode = mode;
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === mode));
  $('updateTarget').hidden = mode !== 'update';
  $('genResult').innerHTML = '';
  refreshUpdateSelect();
}

function refreshUpdateSelect() {
  const sel = $('updateSelect');
  sel.innerHTML = myApps.map(a =>
    `<option value="${a.id}">${esc(a.name)} (v${a.version})</option>`).join('')
    || '<option value="">（暂无应用可选）</option>';
}

function setGenTarget(app) {
  setMode('update');
  const sel = $('updateSelect');
  sel.value = app ? app.id : (myApps[0] && myApps[0].id || '');
  $('descInput').value = app ? `参考「${app.name}」优化这个应用：` : '';
}

function loadTplMini() {
  const c = $('tplMini');
  if (c.children.length > 0) return;
  templates.forEach(t => {
    const btn = document.createElement('span');
    btn.className = 'tpl-mini-btn' + (t.name === 'minimal' ? ' on' : '');
    btn.textContent = t.description.split('：')[0] || t.name;
    btn.dataset.name = t.name;
    btn.onclick = () => {
      document.querySelectorAll('.tpl-mini-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
    };
    c.appendChild(btn);
  });
}

function getSelectedTpl() {
  const sel = document.querySelector('.tpl-mini-btn.on');
  return sel ? sel.dataset.name : 'minimal';
}

// ====== 生成应用（新建 / 更新） ======
async function generateApp() {
  const desc = $('descInput').value.trim();
  if (!desc) { $('descInput').focus(); return; }
  const btn = $('genSubmit');
  const payload = { description: desc, template: getSelectedTpl(), build: false, mode: genMode };

  if (genMode === 'update') {
    const targetId = $('updateSelect').value;
    if (!targetId) { $('genResult').innerHTML = '✗ 请先选择要更新的应用'; return; }
    const target = myApps.find(a => a.id === targetId);
    // 所有者同意更新确认
    if (!confirm(`将根据你的新描述更新「${target.name}」。\n生成后会新增一个版本（v${target.version} -> v${nextVer(target.version)}），需所有者（你）同意后生效。\n确定继续吗？`)) {
      return;
    }
    payload.target_id = targetId;
  }

  btn.disabled = true; btn.textContent = '生成中…';
  $('genResult').innerHTML = '';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '生成失败');
    pendingApp = data.app;
    const isUpdate = genMode === 'update' && pendingApp;
    $('genResult').innerHTML =
      `<div style="color:var(--ok)">✓ ${isUpdate ? '已更新到新版本 v' + pendingApp.version + '（仅你可使用）' : '已新建应用（仅你可使用）'}</div>` +
      `<div class="res-actions">
        <button class="res-btn primary" onclick="usePendingApp()">▶ 立即使用</button>
        <button class="res-btn" onclick="publishPendingApp()">🚀 发布到市场</button>
        ${isUpdate ? '<button class="res-btn" onclick="goToMyApps()">查看我的应用</button>' : ''}
      </div>`;
    closeGenerator();
    setView('myapps');
    await loadMyApps();
  } catch (e) {
    $('genResult').innerHTML = '✗ ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '✨ 生成';
  }
}

function nextVer(v) {
  const p = String(v).split('.').map(Number);
  p[2] = (p[2] || 0) + 1;
  return p.join('.');
}

function usePendingApp() { if (pendingApp) openApp(pendingApp.id); }
function publishPendingApp() { if (pendingApp) openPublish(pendingApp.id); }
function goToMyApps() { setView('myapps'); }

// ====== 加载市场与我的应用 ======
async function loadMarket() {
  try {
    const res = await fetch('/api/market');
    const data = await res.json();
    marketApps = data.apps || [];
    renderAvailBar();
    renderTagBar(data.tags);
    renderMarketApps();
  } catch (e) {
    $('marketGrid').innerHTML = `<div class="market-empty"><div class="big">⚠️</div><p>加载失败：${e.message}</p></div>`;
  }
}

async function loadMyApps() {
  try {
    const res = await fetch('/api/my-apps');
    const data = await res.json();
    myApps = data.apps || [];
    refreshUpdateSelect();
    renderMyApps();
  } catch (e) { /* 忽略 */ }
}

// ====== 市场筛选 ======
function renderAvailBar() {
  const bar = $('availBar');
  const tag = currentPlatforms.includes('车机') ? '车机'
    : currentPlatforms.includes('手机') ? '手机'
    : currentPlatforms.includes('平板') ? '平板' : '电脑';
  bar.innerHTML = `
    <span class="current-device">当前设备：<span class="dev-badge">${tag}</span></span>
    <span class="avail-switch">
      <button class="avail-btn ${availFilter === '可用' ? 'on' : ''}" data-avail="可用">✅ 当前可用</button>
      <button class="avail-btn ${availFilter === '不可用' ? 'on warn' : ''}" data-avail="不可用">🚫 其他平台可用</button>
    </span>
  `;
  bar.querySelectorAll('.avail-btn').forEach(btn => {
    btn.onclick = () => {
      availFilter = btn.dataset.avail;
      renderAvailBar();
      renderMarketApps();
    };
  });
}

function renderTagBar(tags) {
  const bar = $('filterBar');
  let html = '<span class="label">分类</span>';
  ['全部', ...tags].forEach(t => {
    const on = t === tagFilter ? ' on' : '';
    html += `<span class="filter-chip tag${on}" data-t="${t}">${t}</span>`;
  });
  bar.innerHTML = html;
  bar.querySelectorAll('.filter-chip[data-t]').forEach(c => {
    c.onclick = () => {
      tagFilter = c.dataset.t;
      renderTagBar(tags);
      renderMarketApps();
    };
  });
}

function renderMarketApps() {
  const grid = $('marketGrid');
  let filtered = availFilter === '可用'
    ? marketApps.filter(supportsCurrent)
    : marketApps.filter(a => !supportsCurrent(a));
  if (tagFilter !== '全部') filtered = filtered.filter(a => a.tags.includes(tagFilter));
  $('marketCount').textContent = `市场 ${filtered.length} 款`;

  if (filtered.length === 0) {
    const tip = availFilter === '可用'
      ? '当前设备可用的应用都在这了<br>可以点顶部「✨ 生成新应用」做一个'
      : '这些应用都能在其他平台运行<br>切回「当前可用」看本机可用的应用';
    grid.innerHTML = `<div class="market-empty"><div class="big">📭</div><p>${tip}</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(a => cardHTML(a, a.owner)).join('');
}

function cardHTML(a) {
  const tags = (a.tags || []).map(t => `<span class="app-tag">${t}</span>`).join('');
  const platforms = (a.platforms || []).map(p => `<span class="plat-badge">${p}</span>`).join('');
  const thumbSrc = `/static/templates/${a.template}.png`;
  const canRun = supportsCurrent(a);
  const vis = a.visibility === 'public'
    ? '<span class="vis-badge public">已发布</span>'
    : '<span class="vis-badge private">私有</span>';
  const ver = `<span class="ver-badge">v${a.version}</span>`;
  return `<div class="app-card" onclick="openApp('${a.id}')">
    <img class="app-thumb" src="${thumbSrc}" alt="${a.name}" loading="lazy" onerror="this.style.background='linear-gradient(135deg,#1a1d24,#2a2d38)'">
    <div class="app-body">
      <div class="app-name">${esc(a.name)}${canRun ? '' : '<span class="not-sup" title="当前设备不支持">⛔</span>'}${ver}</div>
      <div class="app-desc">${esc(a.description)}</div>
      <div class="app-tags">${tags}</div>
      <div class="app-platforms">${platforms}</div>
    </div>
  </div>`;
}

// ====== 我的应用 ======
function renderMyApps() {
  const grid = $('myGrid');
  if (myApps.length === 0) {
    grid.innerHTML = `<div class="market-empty"><div class="big">👤</div><p>还没有自己的应用<br>点顶部「✨ 生成新应用」创建第一个</p></div>`;
    return;
  }
  grid.innerHTML = myApps.map(a => {
    const tags = (a.tags || []).map(t => `<span class="app-tag">${t}</span>`).join('');
    const platforms = (a.platforms || []).map(p => `<span class="plat-badge">${p}</span>`).join('');
    const thumbSrc = `/static/templates/${a.template}.png`;
    const vis = a.visibility === 'public'
      ? '<span class="vis-badge public">已发布</span>'
      : '<span class="vis-badge private">私有</span>';
    const publishBtn = a.visibility === 'public'
      ? '<button class="my-btn" onclick="event.stopPropagation(); openApp(\'' + a.id + '\')">📄 详情</button>'
      : '<button class="my-btn publish" onclick="event.stopPropagation(); openPublish(\'' + a.id + '\')">🚀 发布</button>';
    return `<div class="app-card" onclick="openApp('${a.id}')">
      <img class="app-thumb" src="${thumbSrc}" alt="${a.name}" loading="lazy" onerror="this.style.background='linear-gradient(135deg,#1a1d24,#2a2d38)'">
      <div class="app-body">
        <div class="app-name">${esc(a.name)} ${vis}<span class="ver-badge">v${a.version}</span></div>
        <div class="app-desc">${esc(a.description)}</div>
        <div class="app-tags">${tags}</div>
        <div class="app-platforms">${platforms}</div>
        <div class="my-actions">
          <button class="my-btn" onclick="event.stopPropagation(); openApp('${a.id}')">▶ 使用</button>
          <button class="my-btn" onclick="event.stopPropagation(); openUpdate('${a.id}')">🔄 更新</button>
          ${publishBtn}
          <button class="my-btn danger" onclick="event.stopPropagation(); deleteApp('${a.id}')">🗑 删除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function openUpdate(id) {
  const app = myApps.find(a => a.id === id);
  openGenerator();
  setGenTarget(app);
  $('descInput').focus();
  $('genDrawer').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

async function deleteApp(id) {
  if (!confirm('确定删除这个应用吗？此操作不可恢复。')) return;
  const res = await fetch('/api/delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  const data = await res.json();
  if (!data.ok) { alert(data.error || '删除失败'); return; }
  await loadMyApps();
  loadMarket();
}

// ====== 发布弹窗 ======
const ALL_PLATS = ['网页', '手机', '电脑', 'macOS', 'Windows', '鸿蒙', '车机', '电视盒'];
let publishId = null;

function openPublish(id) {
  const app = (myApps.find(a => a.id === id)) || (marketApps.find(a => a.id === id));
  if (!app) return;
  publishId = id;
  $('pubName').value = app.name || '';
  $('pubDesc').value = app.description || '';
  $('pubTags').value = (app.tags || []).join(', ');
  $('pubPlatforms').value = (app.platforms || ALL_PLATS).join(', ');
  $('pubModal').classList.add('show');
}

function closePublish() {
  $('pubModal').classList.remove('show');
  publishId = null;
}

async function confirmPublish() {
  const name = $('pubName').value.trim();
  if (!name) { alert('请填写应用名称'); return; }
  const tags = $('pubTags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const platforms = $('pubPlatforms').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const body = {
    id: publishId,
    name,
    description: $('pubDesc').value.trim(),
    tags,
    platforms
  };
  const res = await fetch('/api/publish', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (!data.ok) { alert(data.error || '发布失败'); return; }
  closePublish();
  await loadMyApps();
  loadMarket();
}

// ====== 打开应用 ======
let _appData = null;

function getAppById(id) {
  return myApps.find(a => a.id === id)
    || marketApps.find(a => a.id === id)
    || null;
}

async function openApp(id) {
  currentAppId = id;
  try {
    const res = await fetch(`/api/app/${id}`);
    const data = await res.json();
    if (!data.ok || !data.app) throw new Error(data.error || '应用不存在');
    _appData = data;
    showWindow(data.app, data.mock_content || '');
  } catch (e) {
    alert('打开失败：' + e.message);
  }
}

function showWindow(app, content) {
  $('winName').textContent = app.name;
  $('winVersion').textContent = 'v' + app.version;
  $('winPlatforms').innerHTML = (app.platforms || []).map(p => `<span class="plat-badge">${p}</span>`).join('');
  $('winBody').innerHTML = `<div class="mock-content">${esc(content)}</div>`;
  const isMine = app.owner === 'me';
  $('winOwner').innerHTML =
    `<span>所有者：${app.owner === 'me' ? '我' : esc(app.owner)}</span>` +
    (app.visibility === 'public'
      ? '<span class="vis-badge public">已发布</span>'
      : '<span class="vis-badge private">私有</span>');
  // 操作按钮：自己的应用可更新；官方/他人应用只能以此为参考新建
  if (isMine) {
    $('winActionBtns').innerHTML =
      `<button class="custom-gen" onclick="updateThisApp()">🔄 更新此应用</button>
       <button class="custom-gen" style="background:var(--panel-2);color:var(--text);border:1px solid var(--border)" onclick="customGenerate()">基于此应用为生成新应用</button>`;
  } else {
    $('winActionBtns').innerHTML =
      `<button class="custom-gen" onclick="customGenerate()">基于此应用为生成新应用</button>`;
  }
  $('appWindow').classList.add('show');
  document.body.style.overflow = 'hidden';
  backgroundApps = backgroundApps.filter(a => a.id !== app.id);
  renderTaskbar();
}

function updateThisApp() {
  const app = _appData && _appData.app;
  closeApp();
  const g = getAppById(app.id) || app;
  if (!g) return;
  const mine = myApps.find(a => a.id === app.id);
  openGenerator();
  setGenTarget(mine || { id: app.id, name: app.name, version: app.version });
  $('descInput').value = `优化「${app.name}」：`;
  $('genDrawer').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ====== 最小化 / 关闭 ======
function minimizeApp() {
  if (!_appData || !_appData.app) return;
  const app = _appData.app;
  if (!backgroundApps.find(a => a.id === app.id)) {
    backgroundApps.push({ id: app.id, name: app.name, template: app.template });
  }
  closeWindow();
  renderTaskbar();
}

function closeApp() {
  if (!_appData || !_appData.app) return;
  closeWindow();
  backgroundApps = backgroundApps.filter(a => a.id !== _appData.app.id);
  renderTaskbar();
  _appData = null;
  currentAppId = null;
}

function closeWindow() {
  $('appWindow').classList.remove('show');
  document.body.style.overflow = '';
}

function customGenerate() {
  const app = _appData && _appData.app;
  closeApp();
  // 始终以“新建”方式，参考现有应用
  setMode('new');
  if (!$('genDrawer').classList.contains('show')) toggleGenerator();
  $('descInput').value = app ? `参考「${app.name}」做一个类似的应用：` : '';
  $('genResult').innerHTML = '';
  $('descInput').focus();
}

async function reportApp() {
  const app = _appData && _appData.app;
  if (!app) return;
  const reason = prompt('请简要说明举报「' + app.name + '」的原因：', '');
  if (reason === null) return;
  try {
    const res = await fetch('/api/report', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: app.id, reason })
    });
    const data = await res.json();
    if (!data.ok) { alert(data.error || '举报失败'); return; }
    alert('已收到你对「' + app.name + '」的举报，管理员会在后台核查处理。');
    loadMarket();
  } catch (e) {
    alert('举报失败：' + e.message);
  }
}

function closeAllWindows() {
  closeWindow();
  _appData = null;
  currentAppId = null;
}

// ====== 任务栏 ======
function renderTaskbar() {
  const bar = $('taskbar');
  if (backgroundApps.length === 0) { bar.classList.remove('show'); return; }
  bar.classList.add('show');
  $('taskIcons').innerHTML = backgroundApps.map(a => `
    <div class="task-icon" onclick="reopenApp('${a.id}')">
      <span>${esc(a.name)}</span>
      <span class="task-close" onclick="event.stopPropagation(); killApp('${a.id}')">✕</span>
    </div>`).join('');
}
function reopenApp(id) { openApp(id); }
function killApp(id) {
  backgroundApps = backgroundApps.filter(a => a.id !== id);
  if (currentAppId === id) { closeWindow(); _appData = null; currentAppId = null; }
  renderTaskbar();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s ?? '');
  return d.innerHTML;
}

// ====== 后台管理系统 ======
const STATUS_LABEL = {
  published: '已发布', reviewing: '审核中', draft: '草稿', disabled: '已停用'
};

function admStatusBadge(status) {
  return `<span class="a-badge ${status}">${STATUS_LABEL[status] || status}</span>`;
}

function setAdminPanel(panel) {
  currentAdminPanel = panel;
  document.querySelectorAll('.admin-menu-item').forEach(b =>
    b.classList.toggle('on', b.dataset.panel === panel));
  ['stats', 'apps', 'users', 'prompt'].forEach(p =>
    $('panel' + (p === 'stats' ? 'Stats' : p[0].toUpperCase() + p.slice(1))).hidden = p !== panel);
  loadAdminPanel(panel);
}

function loadAdminPanel(panel) {
  if (panel === 'stats') loadAdminStats();
  else if (panel === 'apps') loadAdminApps();
  else if (panel === 'users') loadAdminUsers();
  else if (panel === 'prompt') loadAdminPrompt();
}

// --- 使用统计 ---
async function loadAdminStats() {
  const res = await fetch('/api/admin/stats');
  const d = await res.json();
  adminStats = d;
  renderAdminStats(d);
}

function renderAdminStats(d) {
  const el = $('panelStats');
  const userRows = (d.users || []).map(u => `
    <tr>
      <td>${esc(u.name)}</td>
      <td>${u.role === 'admin' ? '<span class="a-badge admin">管理员</span>' : '用户'}</td>
      <td>${u.status === 'active' ? '<span class="a-badge active">正常</span>' : '<span class="a-badge disabled">停用</span>'}</td>
      <td>${u.apps_generated}</td>
      <td>${u.launches}</td>
      <td>${u.incentive}</td>
    </tr>`).join('');
  const topApps = (d.top_apps || []).map((a, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${esc(a.name)}</td>
      <td>${esc(appOwnerName(a.owner))}</td>
      <td>${admStatusBadge(a.status)}</td>
      <td>${a.launches}</td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="admin-card">
      <h3>📊 平台概览</h3>
      <div class="sub">应用使用情况总览，为后续用户激励、广告分成等运营提供数据依据</div>
      <div class="stat-row">
        <div class="stat-card"><div class="num">${d.total_apps}</div><div class="lbl">应用总数</div></div>
        <div class="stat-card"><div class="num">${d.published}</div><div class="lbl">已上架</div></div>
        <div class="stat-card"><div class="num">${d.reviewing}</div><div class="lbl">审核中</div></div>
        <div class="stat-card"><div class="num">${d.disabled}</div><div class="lbl">已停用</div></div>
        <div class="stat-card"><div class="num">${d.total_launches}</div><div class="lbl">累计启动</div></div>
        <div class="stat-card"><div class="num">${d.total_users}</div><div class="lbl">注册用户</div></div>
        <div class="stat-card"><div class="num">${d.active_users}</div><div class="lbl">活跃用户</div></div>
        <div class="stat-card"><div class="num">${d.total_incentive}</div><div class="lbl">已发放激励</div></div>
      </div>
    </div>
    <div class="admin-card">
      <h3>🏆 热门应用 TOP</h3>
      <div class="sub">按启动次数排序</div>
      <table class="admin-table">
        <thead><tr><th>#</th><th>应用</th><th>所有者</th><th>状态</th><th>启动次数</th></tr></thead>
        <tbody>${topApps || '<tr><td colspan="5">暂无数据</td></tr>'}</tbody>
      </table>
    </div>
    <div class="admin-card">
      <h3>👥 用户贡献</h3>
      <div class="sub">生成数与启动量（激励为后续激励计划的占位数据）</div>
      <table class="admin-table">
        <thead><tr><th>用户</th><th>角色</th><th>状态</th><th>生成应用</th><th>启动次数</th><th>激励</th></tr></thead>
        <tbody>${userRows || '<tr><td colspan="6">暂无数据</td></tr>'}</tbody>
      </table>
    </div>`;
}

function appOwnerName(owner) {
  if (owner === 'me') return '我';
  const u = adminUsers.find(x => x.id === owner);
  return u ? u.name : owner;
}

// --- 应用管理 ---
async function loadAdminApps() {
  const res = await fetch('/api/admin/apps');
  const d = await res.json();
  adminApps = d.apps || [];
  renderAdminApps();
}

function renderAdminApps() {
  const el = $('panelApps');
  const rows = adminApps.map(a => {
    const tags = (a.tags || []).map(t => `<span class="app-tag">${t}</span>`).join('');
    const plat = (a.platforms || []).map(p => `<span class="plat-badge">${p}</span>`).join(' ');
    let actions = '';
    if (a.status === 'reviewing') {
      actions = `<button class="small-btn ok" onclick="adminReview('${a.id}','approve')">✅ 通过</button>
                 <button class="small-btn danger" onclick="adminReview('${a.id}','reject')">⛔ 驳回</button>`;
    }
    if (a.status === 'published') {
      actions = `<button class="small-btn warn" onclick="adminStatus('${a.id}','disable')">🛑 停用</button>
                 <button class="small-btn" onclick="adminEditApp('${a.id}')">✏️ 编辑</button>
                 <button class="small-btn danger" onclick="adminDelete('${a.id}')">🗑 删除</button>`;
    } else if (a.status === 'disabled') {
      actions = `<button class="small-btn ok" onclick="adminStatus('${a.id}','enable')">▶ 恢复</button>`;
    } else if (a.status === 'draft') {
      actions = `<button class="small-btn ok" onclick="adminStatus('${a.id}','publish')">🚀 上架</button>`;
    }
    if (a.status !== 'published' && a.status !== 'disabled') {
      actions += ` <button class="small-btn" onclick="adminEditApp('${a.id}')">✏️ 编辑</button>
                   <button class="small-btn danger" onclick="adminDelete('${a.id}')">🗑 删除</button>`;
    }
    return `<tr>
      <td><b>${esc(a.name)}</b><br><span class="a-note">${esc(appOwnerName(a.owner))}</span></td>
      <td>${admStatusBadge(a.status)}<br><span class="a-note">v${a.version}</span></td>
      <td>${tags || '<span class="a-note">—</span>'}</td>
      <td>${plat || '<span class="a-note">—</span>'}</td>
      <td>${a.launches}</td>
      <td class="a-note">${a.report ? '🚩 ' + esc(a.report) : '—'}</td>
      <td class="a-note">${esc(a.review_note) || '—'}</td>
      <td><div class="admin-actions">${actions}</div></td>
    </tr>`;
  }).join('');
  el.innerHTML = `
    <div class="admin-card">
      <h3>📦 应用管理</h3>
      <div class="sub">审核、上架、停用、编辑与下架。新发布的应用进入“审核中”，通过后才对市场公开</div>
      <div class="admin-actions" style="margin-bottom:12px">
        <button class="small-btn ${currentAdminFilter==='all'?'':''}" onclick="setAdminAppFilter('all')">全部</button>
        <button class="small-btn" onclick="setAdminAppFilter('reviewing')">仅审核中</button>
        <button class="small-btn ok" onclick="setAdminAppFilter('published')">已上架</button>
        <button class="small-btn warn" onclick="setAdminAppFilter('draft')">草稿</button>
        <button class="small-btn danger" onclick="setAdminAppFilter('disabled')">已停用</button>
      </div>
      <table class="admin-table">
        <thead><tr><th>应用</th><th>状态</th><th>标签</th><th>平台</th><th>启动</th><th>举报</th><th>审核意见</th><th>操作</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="8">暂无数据</td></tr>'}</tbody>
      </table>
    </div>`;
}

let currentAdminFilter = 'all';
async function setAdminAppFilter(f) {
  currentAdminFilter = f;
  const res = await fetch('/api/admin/apps');
  const d = await res.json();
  adminApps = (d.apps || []);
  if (f !== 'all') adminApps = adminApps.filter(a => a.status === f);
  renderAdminApps();
}

async function adminReview(id, action) {
  const note = action === 'reject'
    ? (prompt('请填写驳回意见：', '') ?? '') : '';
  const res = await fetch('/api/admin/app/review', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, action, note })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || '操作失败'); return; }
  await loadAdminApps(); loadMarket();
}

async function adminStatus(id, action) {
  const res = await fetch('/api/admin/app/status', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, action })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || '操作失败'); return; }
  await loadAdminApps(); loadMarket();
}

async function adminEditApp(id) {
  const a = adminApps.find(x => x.id === id);
  if (!a) return;
  const name = prompt('应用名称：', a.name);
  if (name === null) return;
  const desc = prompt('应用描述：', a.description);
  if (desc === null) return;
  const tags = prompt('标签（逗号分隔）：', (a.tags || []).join(','));
  if (tags === null) return;
  const platforms = prompt('支持平台（逗号分隔）：', (a.platforms || []).join(','));
  if (platforms === null) return;
  const res = await fetch('/api/admin/app/edit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      id, name,
      description: desc,
      tags: tags.split(/[,，]/).map(s => s.trim()).filter(Boolean),
      platforms: platforms.split(/[,，]/).map(s => s.trim()).filter(Boolean)
    })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || '编辑失败'); return; }
  await loadAdminApps(); loadMarket();
}

async function adminDelete(id) {
  if (!confirm('确定删除该应用吗？此操作不可恢复。')) return;
  const res = await fetch('/api/admin/app/delete', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || '删除失败'); return; }
  await loadAdminApps(); loadMarket();
}

// --- 用户管理 ---
async function loadAdminUsers() {
  const res = await fetch('/api/admin/users');
  const d = await res.json();
  adminUsers = d.users || [];
  renderAdminUsers();
}

function renderAdminUsers() {
  const el = $('panelUsers');
  const rows = adminUsers.map(u => `
    <tr>
      <td><b>${esc(u.name)}</b><br><span class="a-note">${esc(u.id)}</span></td>
      <td>${u.role === 'admin' ? '<span class="a-badge admin">管理员</span>' : '<span class="a-badge">用户</span>'}</td>
      <td>${u.status === 'active' ? '<span class="a-badge active">正常</span>' : '<span class="a-badge disabled">停用</span>'}</td>
      <td>${u.apps_generated}</td>
      <td>${u.launches}</td>
      <td>${u.incentive}</td>
      <td>
        ${u.role !== 'admin' ? (u.status === 'active'
          ? '<button class="small-btn warn" onclick="adminToggleUser(\'' + u.id + '\',\'disable\')">🛑 停用</button>'
          : '<button class="small-btn ok" onclick="adminToggleUser(\'' + u.id + '\',\'enable\')">▶ 启用</button>')
          : '<span class="a-note">—</span>'}
      </td>
    </tr>`).join('');
  el.innerHTML = `
    <div class="admin-card">
      <h3>👥 用户管理</h3>
      <div class="sub">管理平台用户，可启用 / 停用账号（单用户原型，预置示例用户）</div>
      <table class="admin-table">
        <thead><tr><th>用户</th><th>角色</th><th>状态</th><th>生成应用</th><th>启动次数</th><th>激励</th><th>操作</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="7">暂无数据</td></tr>'}</tbody>
      </table>
    </div>`;
}

async function adminToggleUser(id, action) {
  const res = await fetch('/api/admin/user/toggle', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id, action })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || '操作失败'); return; }
  loadAdminUsers();
}

// --- 提示词迭代 ---
async function loadAdminPrompt() {
  const res = await fetch('/api/admin/prompt');
  const d = await res.json();
  if (!d.ok) return;
  const el = $('panelPrompt');
  el.innerHTML = `
    <div class="admin-card">
      <h3>🤖 生成应用技能提示词</h3>
      <div class="sub">文本独立维护、带版本号、结构化分区，可在线持续迭代；保存后对后续生成立即生效</div>
      <div class="prompt-meta">
        <span class="a-badge review">版本 ${esc(d.version)}</span>
        <button class="small-btn" onclick="resetAdminPrompt()">↺ 恢复内置默认</button>
      </div>
      <textarea class="prompt-box" id="promptBox">${esc(d.prompt)}</textarea>
      <div style="margin-top:12px;text-align:right">
        <button class="m-btn primary" onclick="saveAdminPrompt()">💾 保存生效</button>
      </div>
    </div>`;
}

async function saveAdminPrompt() {
  const content = $('promptBox').value;
  const res = await fetch('/api/admin/prompt', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: content })
  });
  const d = await res.json();
  if (!d.ok) { alert(d.error || '保存失败'); return; }
  alert('已保存并生效，后续生成将使用最新提示词。');
}

async function resetAdminPrompt() {
  if (!confirm('恢复为内置默认提示词？当前编辑内容将被覆盖。')) return;
  const res = await fetch('/api/admin/prompt/reset', { method: 'POST' });
  const d = await res.json();
  if (!d.ok) { alert(d.error || '恢复失败'); return; }
  $('promptBox').value = d.prompt;
  alert('已恢复内置默认提示词，点“保存生效”使其生效。');
}

// ====== 初始化 ======
(async function init() {
  currentPlatforms = detectPlatforms();
  document.querySelectorAll('.nav-tab').forEach(t =>
    t.onclick = () => setView(t.dataset.view));
  document.querySelectorAll('.admin-menu-item').forEach(b =>
    b.onclick = () => { setAdminPanel(b.dataset.panel); });
  const tres = await fetch('/api/templates');
  const tdata = await tres.json();
  templates = tdata.templates || [];
  loadMarket();
  loadMyApps();
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('appWindow').classList.contains('show')) minimizeApp();
  });
})();
</script>
</body>
</html>
