<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小应用工坊 · aiapp</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #22262f;
    --border: #2c313c;
    --text: #e8eaed;
    --muted: #9aa0aa;
    --accent: #4f8cff;
    --accent-2: #6ea8ff;
    --ok: #34c759;
    --err: #ff5c5c;
    --tag-bg: #1e2a3a;
    --tag-border: #2c3d55;
    --overlay: rgba(0,0,0,0.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden;
  }

  /* ===== 顶部栏 ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 24px; background: var(--panel);
    border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
  }
  .topbar .logo {
    font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #6ea8ff, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    cursor: pointer;
  }
  .topbar .logo small { font-size: 12px; -webkit-text-fill-color: var(--muted); }
  .topbar-right { display: flex; gap: 10px; align-items: center; }
  .topbar .gen-toggle {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  .topbar .gen-toggle:hover { background: var(--accent-2); }
  .topbar .gen-toggle.on { background: var(--panel-2); color: var(--muted); border: 1px solid var(--border); }
  .topbar .stats { font-size: 13px; color: var(--muted); }

  /* ===== 生成器抽屉 ===== */
  .gen-drawer {
    display: none; background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 20px 24px; position: sticky; top: 52px; z-index: 49;
  }
  .gen-drawer.show { display: block; }
  .gen-drawer textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; font-size: 14px; font-family: inherit;
    outline: none; min-height: 70px; resize: vertical;
  }
  .gen-drawer textarea:focus { border-color: var(--accent); }
  .gen-drawer .gen-row {
    display: flex; gap: 12px; align-items: center; margin-top: 12px; flex-wrap: wrap;
  }
  .gen-drawer .tpl-mini {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .tpl-mini-btn {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .tpl-mini-btn:hover { border-color: var(--muted); }
  .tpl-mini-btn.on { border-color: var(--accent); color: var(--accent-2); }
  .gen-drawer .gen-submit {
    background: var(--accent); color: #fff; border: none; border-radius: 8px;
    padding: 8px 20px; font-size: 14px; font-weight: 600; cursor: pointer;
    margin-left: auto;
  }
  .gen-drawer .gen-submit:hover { background: var(--accent-2); }
  .gen-drawer .gen-submit:disabled { opacity: .5; cursor: not-allowed; }

  /* ===== 主页（市场） ===== */
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 20px 80px; }

  /* 筛选行 */
  .filter-bar {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-bottom: 16px;
  }
  .filter-bar .label { font-size: 12px; color: var(--muted); margin-right: 4px; }
  .filter-chip {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px; font-size: 12px;
    color: var(--muted); cursor: pointer; transition: all .15s;
    user-select: none;
  }
  .filter-chip:hover { border-color: var(--muted); color: var(--text); }
  .filter-chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .filter-chip.tag { border-radius: 4px; }

  /* 应用卡片网格 */
  .app-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  @media (max-width: 1100px) { .app-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) { .app-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .app-grid { grid-template-columns: 1fr; } }
  .app-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .app-card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .app-card .app-thumb {
    width: 100%; height: 120px; object-fit: cover; display: block;
    background: linear-gradient(135deg, #1a1d24 0%, #2a2d38 100%);
  }
  .app-card .app-body { padding: 14px; }
  .app-card .app-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .app-card .app-desc { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  .app-card .app-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
  .app-tag {
    font-size: 11px; background: var(--tag-bg); color: var(--accent-2);
    border: 1px solid var(--tag-border); border-radius: 4px; padding: 2px 7px;
  }
  .app-card .app-platforms { display: flex; gap: 4px; flex-wrap: wrap; }
  .plat-badge {
    font-size: 11px; background: var(--panel-2); color: var(--muted);
    border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px;
  }
  .market-empty {
    grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted);
  }
  .market-empty .big { font-size: 40px; margin-bottom: 12px; }
  .market-empty p { font-size: 14px; line-height: 1.6; }

  /* ===== 应用窗口（模拟桌面） ===== */
  .app-window {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: var(--overlay); backdrop-filter: blur(4px);
  }
  .app-window.show { display: flex; align-items: center; justify-content: center; }
  .app-window .window-frame {
    width: 90%; max-width: 680px; max-height: 85vh;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5); animation: windowIn .2s ease;
  }
  @keyframes windowIn { from { transform: scale(.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .app-window .window-titlebar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; background: var(--panel-2);
    border-bottom: 1px solid var(--border);
  }
  .app-window .window-titlebar .win-info { display: flex; align-items: center; gap: 10px; }
  .app-window .window-titlebar .win-name { font-size: 15px; font-weight: 700; }
  .app-window .window-titlebar .win-platforms { display: flex; gap: 4px; }
  .app-window .window-titlebar .win-actions { display: flex; gap: 8px; }
  .win-btn {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--muted); font-size: 16px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all .15s;
  }
  .win-btn:hover { background: var(--panel-2); color: var(--text); }
  .win-btn.close:hover { background: #e81123; color: #fff; border-color: #e81123; }
  .app-window .window-body {
    flex: 1; overflow: auto; padding: 20px; min-height: 300px;
  }
  .app-window .mock-content {
    font-family: "SF Mono", Consolas, "Courier New", monospace;
    font-size: 13px; line-height: 1.6; white-space: pre; color: var(--text);
    background: #0a0c10; border-radius: 10px; padding: 20px;
  }
  .app-window .window-source {
    border-top: 1px solid var(--border); padding: 16px 18px;
    background: var(--panel-2);
  }
  .app-window .window-source summary {
    cursor: pointer; font-size: 13px; color: var(--muted);
    font-weight: 600;
  }
  .app-window .window-source pre {
    margin-top: 10px; font-size: 12px; max-height: 150px; overflow: auto;
    color: var(--muted); line-height: 1.5;
  }

  /* ===== 底部任务栏（后台运行应用） ===== */
  .taskbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 6px 16px; display: none; gap: 6px; align-items: center;
  }
  .taskbar.show { display: flex; }
  .taskbar .task-label { font-size: 11px; color: var(--muted); margin-right: 6px; }
  .task-icon {
    display: flex; align-items: center; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px; cursor: pointer;
    font-size: 12px; transition: all .15s;
  }
  .task-icon:hover { border-color: var(--accent); }
  .task-icon .task-close {
    font-size: 14px; color: var(--muted); margin-left: 4px;
    width: 16px; height: 16px; display: flex; align-items: center; justify-content: center;
    border-radius: 4px;
  }
  .task-icon .task-close:hover { background: #e81123; color: #fff; }

  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 40px; line-height: 1.8; }
</style>
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<div class="topbar">
  <div class="logo" onclick="closeAllWindows(); closeGenerator()">✦ 小应用工坊 <small>· 选个应用打开试试</small></div>
  <div class="topbar-right">
    <span class="stats" id="marketCount"></span>
    <button class="gen-toggle" id="genToggle" onclick="toggleGenerator()">✨ 生成新应用</button>
  </div>
</div>

<!-- ===== 生成器抽屉 ===== -->
<div class="gen-drawer" id="genDrawer">
  <textarea id="descInput" placeholder="描述你想要的应用，比如：做一个统计本月到账金额的小工具，按日期汇总"></textarea>
  <div class="gen-row">
    <div class="tpl-mini" id="tplMini"></div>
    <button class="gen-submit" id="genSubmit" onclick="generateApp()">✨ 生成</button>
  </div>
  <div id="genResult" style="margin-top:10px;font-size:13px;color:var(--muted)"></div>
</div>

<!-- ===== 主页：应用市场 ===== -->
<div class="wrap">
  <!-- 筛选 -->
  <div class="filter-bar" id="filterBar"></div>

  <!-- 应用网格 -->
  <div class="app-grid" id="appGrid"></div>
</div>

<!-- ===== 应用窗口（模拟打开） ===== -->
<div class="app-window" id="appWindow">
  <div class="window-frame">
    <div class="window-titlebar">
      <div class="win-info">
        <span class="win-name" id="winName"></span>
        <span class="win-platforms" id="winPlatforms"></span>
      </div>
      <div class="win-actions">
        <button class="win-btn" onclick="minimizeApp()" title="最小化到后台">─</button>
        <button class="win-btn close" onclick="closeApp()" title="关闭应用">✕</button>
      </div>
    </div>
    <div class="window-body" id="winBody"></div>
    <div class="window-source">
      <details>
        <summary>查看应用源码</summary>
        <pre id="winSource"></pre>
      </details>
    </div>
  </div>
</div>

<!-- ===== 底部任务栏（后台运行） ===== -->
<div class="taskbar" id="taskbar">
  <span class="task-label">📌 后台运行</span>
  <div id="taskIcons"></div>
</div>

<div class="footer">
  小应用工坊 · 点击应用卡片打开体验 · 一份代码，全平台运行
</div>

<script>
// ====== 状态 ======
let templates = [];
let marketApps = [];
let platformFilter = '全部';
let tagFilter = '全部';
let currentAppId = null;      // 当前前台打开的应用
let backgroundApps = [];      // 后台运行的应用 [{id, name, template}]

const $ = id => document.getElementById(id);

// ====== 生成器切换 ======
function toggleGenerator() {
  const d = $('genDrawer');
  const t = $('genToggle');
  d.classList.toggle('show');
  t.classList.toggle('on');
  t.textContent = d.classList.contains('show') ? '收起' : '✨ 生成新应用';
  if (d.classList.contains('show')) loadTplMini();
}

function closeGenerator() {
  $('genDrawer').classList.remove('show');
  $('genToggle').classList.remove('on');
  $('genToggle').textContent = '✨ 生成新应用';
}

// ====== 模板迷你选择 ======
function loadTplMini() {
  const c = $('tplMini');
  if (c.children.length > 0) return;
  templates.forEach(t => {
    const btn = document.createElement('span');
    btn.className = 'tpl-mini-btn' + (t.name === 'minimal' ? ' on' : '');
    btn.textContent = t.description.split('：')[0] || t.name;
    btn.dataset.name = t.name;
    btn.onclick = () => {
      document.querySelectorAll('.tpl-mini-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
    };
    c.appendChild(btn);
  });
}

function getSelectedTpl() {
  const sel = document.querySelector('.tpl-mini-btn.on');
  return sel ? sel.dataset.name : 'minimal';
}

// ====== 生成应用 ======
async function generateApp() {
  const desc = $('descInput').value.trim();
  if (!desc) { $('descInput').focus(); return; }
  const btn = $('genSubmit');
  btn.disabled = true; btn.textContent = '生成中…';
  $('genResult').textContent = '';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc, template: getSelectedTpl(), build: false })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '生成失败');
    $('genResult').textContent = '✓ 已生成，已加入应用市场';
    $('descInput').value = '';
    closeGenerator();
    loadMarket();
  } catch (e) {
    $('genResult').textContent = '✗ ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = '✨ 生成';
  }
}

// ====== 加载市场 ======
async function loadMarket() {
  try {
    const res = await fetch('/api/market');
    const data = await res.json();
    marketApps = data.apps || [];
    renderFilters(data.platforms, data.tags);
    renderMarketApps();
  } catch (e) {
    $('appGrid').innerHTML = `<div class="market-empty"><div class="big">⚠️</div><p>加载失败：${e.message}</p></div>`;
  }
}

function renderFilters(platforms, tags) {
  const bar = $('filterBar');
  // 平台
  let html = '<span class="label">平台</span>';
  ['全部', ...platforms].forEach(p => {
    const on = p === platformFilter ? ' on' : '';
    html += `<span class="filter-chip${on}" data-p="${p}">${p}</span>`;
  });
  html += '<span class="label" style="margin-left:8px">标签</span>';
  ['全部', ...tags].forEach(t => {
    const on = t === tagFilter ? ' on' : '';
    html += `<span class="filter-chip tag${on}" data-t="${t}">${t}</span>`;
  });
  bar.innerHTML = html;

  bar.querySelectorAll('.filter-chip[data-p]').forEach(c => {
    c.onclick = () => {
      platformFilter = c.dataset.p;
      bar.querySelectorAll('.filter-chip[data-p]').forEach(x => x.classList.remove('on'));
      c.classList.add('on');
      renderMarketApps();
    };
  });
  bar.querySelectorAll('.filter-chip[data-t]').forEach(c => {
    c.onclick = () => {
      tagFilter = c.dataset.t;
      bar.querySelectorAll('.filter-chip[data-t]').forEach(x => x.classList.remove('on'));
      c.classList.add('on');
      renderMarketApps();
    };
  });
}

function renderMarketApps() {
  const grid = $('appGrid');
  let filtered = marketApps;
  if (platformFilter !== '全部') filtered = filtered.filter(a => a.platforms.includes(platformFilter));
  if (tagFilter !== '全部') filtered = filtered.filter(a => a.tags.includes(tagFilter));
  $('marketCount').textContent = `共 ${filtered.length} 个应用`;

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="market-empty"><div class="big">📭</div><p>没有匹配的应用<br>试试切换筛选条件</p></div>`;
    return;
  }

  grid.innerHTML = filtered.map(a => {
    const tags = (a.tags || []).map(t => `<span class="app-tag">${t}</span>`).join('');
    const platforms = (a.platforms || []).map(p => `<span class="plat-badge">${p}</span>`).join('');
    const thumbSrc = `/static/templates/${a.template}.png`;
    return `<div class="app-card" onclick="openApp('${a.id}')">
      <img class="app-thumb" src="${thumbSrc}" alt="${a.name}" loading="lazy" onerror="this.style.background='linear-gradient(135deg,#1a1d24,#2a2d38)'">
      <div class="app-body">
        <div class="app-name">${esc(a.name)}</div>
        <div class="app-desc">${esc(a.description)}</div>
        <div class="app-tags">${tags}</div>
        <div class="app-platforms">${platforms}</div>
      </div>
    </div>`;
  }).join('');
}

// ====== 打开应用 ======
let _appData = null;

async function openApp(id) {
  currentAppId = id;
  try {
    const res = await fetch(`/api/market/${id}`);
    const data = await res.json();
    if (!data.ok || !data.app) throw new Error(data.error || '应用不存在');
    _appData = data;
    showWindow(data.app, data.mock_content || '');
  } catch (e) {
    alert('打开失败：' + e.message);
  }
}

function showWindow(app, content) {
  $('winName').textContent = app.name;
  $('winPlatforms').innerHTML = (app.platforms || []).map(p => `<span class="plat-badge">${p}</span>`).join('');
  $('winBody').innerHTML = `<div class="mock-content">${esc(content)}</div>`;
  $('winSource').textContent = app.source || '// 暂无源码';
  $('appWindow').classList.add('show');
  document.body.style.overflow = 'hidden';
  // 如果已在后台，移除
  backgroundApps = backgroundApps.filter(a => a.id !== app.id);
  renderTaskbar();
}

// ====== 最小化（后台运行） ======
function minimizeApp() {
  if (!_appData || !_appData.app) return;
  const app = _appData.app;
  // 加入后台
  if (!backgroundApps.find(a => a.id === app.id)) {
    backgroundApps.push({ id: app.id, name: app.name, template: app.template });
  }
  closeWindow();
  renderTaskbar();
}

// ====== 关闭应用 ======
function closeApp() {
  if (!_appData || !_appData.app) return;
  closeWindow();
  // 从后台移除
  backgroundApps = backgroundApps.filter(a => a.id !== _appData.app.id);
  renderTaskbar();
  _appData = null;
  currentAppId = null;
}

function closeWindow() {
  $('appWindow').classList.remove('show');
  document.body.style.overflow = '';
}

function closeAllWindows() {
  closeWindow();
  _appData = null;
  currentAppId = null;
}

// ====== 任务栏（后台应用） ======
function renderTaskbar() {
  const bar = $('taskbar');
  const icons = $('taskIcons');
  if (backgroundApps.length === 0) {
    bar.classList.remove('show');
    return;
  }
  bar.classList.add('show');
  icons.innerHTML = backgroundApps.map(a => {
    const thumbSrc = `/static/templates/${a.template}.png`;
    return `<div class="task-icon" onclick="reopenApp('${a.id}')">
      <img src="${thumbSrc}" style="width:18px;height:18px;border-radius:4px;object-fit:cover" onerror="this.style.display='none'">
      ${esc(a.name)}
      <span class="task-close" onclick="event.stopPropagation(); killApp('${a.id}')">✕</span>
    </div>`;
  }).join('');
}

function reopenApp(id) {
  openApp(id);
}

function killApp(id) {
  backgroundApps = backgroundApps.filter(a => a.id !== id);
  if (currentAppId === id) { closeWindow(); _appData = null; currentAppId = null; }
  renderTaskbar();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// ====== 初始化 ======
(async function init() {
  // 加载模板
  const tres = await fetch('/api/templates');
  const tdata = await tres.json();
  templates = tdata.templates || [];
  // 加载市场
  loadMarket();
  // 键盘 Esc 关闭窗口
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && $('appWindow').classList.contains('show')) {
      minimizeApp();
    }
  });
})();
</script>
</body>
</html>
