<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小应用工坊 · aiapp</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #1a1d24;
    --panel-2: #22262f;
    --border: #2c313c;
    --text: #e8eaed;
    --muted: #9aa0aa;
    --accent: #4f8cff;
    --accent-2: #6ea8ff;
    --ok: #34c759;
    --err: #ff5c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
  header { text-align: center; margin-bottom: 32px; }
  header .logo {
    font-size: 26px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(135deg, #6ea8ff, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  header .sub { color: var(--muted); font-size: 16px; margin-top: 8px; line-height: 1.5; }
  header .sub em { color: var(--accent-2); font-style: normal; }
  .tagline {
    display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    margin-top: 16px;
  }
  .chip {
    font-size: 12px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px;
  }
  .chip.active { color: var(--accent-2); border-color: var(--accent); }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px;
  }
  .card-box { margin-top: 20px; }
  textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; font-size: 15px; font-family: inherit;
    outline: none; min-height: 100px; resize: vertical;
  }
  textarea:focus { border-color: var(--accent); }
  .tpl-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    margin-top: 12px;
  }
  @media (max-width: 900px) { .tpl-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 500px) { .tpl-grid { grid-template-columns: 1fr; } }
  .tpl-card {
    background: var(--panel-2); border: 2px solid var(--border);
    border-radius: 12px; overflow: hidden; cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .tpl-card:hover { border-color: var(--muted); transform: translateY(-2px); }
  .tpl-card.active { border-color: var(--accent); }
  .tpl-card img {
    width: 100%; height: 100px; object-fit: cover; display: block;
    background: #0a0c10;
  }
  .tpl-card .tpl-name {
    padding: 10px 12px 8px; font-size: 14px; font-weight: 600;
  }
  .tpl-card .tpl-desc {
    padding: 0 12px 12px; font-size: 12px; color: var(--muted); line-height: 1.5;
  }
  .action-row {
    display: flex; gap: 12px; align-items: center;
    margin-top: 18px; justify-content: flex-end;
  }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 12px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--accent-2); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
  .result { display: none; margin-top: 20px; }
  .result.show { display: block; }
  .result-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
  }
  .status { font-size: 14px; font-weight: 600; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 8px 8px 0 0; padding: 8px 16px; font-size: 13px; cursor: pointer;
    font-weight: 500;
  }
  .tab.on { background: var(--panel-2); color: var(--text); border-bottom-color: var(--panel-2); }
  pre {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; font-size: 13px; overflow: auto; max-height: 420px;
    font-family: "SF Mono", Consolas, "Courier New", monospace; line-height: 1.5;
  }
  .meta { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 10px; }
  .meta-item { background: var(--panel-2); border-radius: 10px; padding: 12px; }
  .meta-item .k { font-size: 12px; color: var(--muted); }
  .meta-item .v { font-size: 14px; margin-top: 4px; word-break: break-all; }
  .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 50px; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">✦ 小应用工坊</div>
    <div class="sub">跟电脑说句话，它就能帮你做一个小应用。<br>手机上、电脑上、电视上、车里……到处都能用。</div>
    <div class="tagline">
      <span class="chip active">网页</span>
      <span class="chip">手机</span>
      <span class="chip">电脑</span>
      <span class="chip">车机</span>
      <span class="chip">电视盒</span>
      <span class="chip">鸿蒙</span>
    </div>
  </header>

  <div class="card">
    <label for="desc" style="font-size:15px;font-weight:600">你想要一个什么样的应用？</label>
    <textarea id="desc" placeholder="举个例子：&#10;做一个统计本月到账金额的小工具，按日期汇总&#10;或者：做一个待办清单，可以添加、勾选、删除事项"></textarea>

    <div class="card-box">
      <div style="font-size:13px;color:var(--muted);font-weight:500">选个模板（或者直接点生成）</div>
      <div class="tpl-grid" id="tplGrid"></div>
    </div>

    <div class="action-row">
      <button id="genBtn">✨ 给我生成</button>
    </div>
    <div class="hint" id="hint">目前用内置模板演示，接入 AI 后你说什么它就能做什么。</div>
  </div>

  <div class="result" id="result">
    <div class="result-head">
      <div class="status" id="status"></div>
      <div class="tabs">
        <button class="tab on" data-tab="manifest">应用信息</button>
        <button class="tab" data-tab="source">应用源码</button>
      </div>
    </div>
    <div id="pane-manifest" class="pane">
      <div class="meta" id="manifestMeta"></div>
    </div>
    <div id="pane-source" class="pane" style="display:none">
      <pre id="sourceCode"></pre>
    </div>
    <div class="hint" id="buildMsg" style="margin-top:10px"></div>
  </div>

  <div class="footer">
    小应用工坊 · 一份代码，全平台运行<br>
    面向企业内网部署 · 正在接入车机、电视盒、鸿蒙等平台
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let templates = [];
let selectedTemplate = 'minimal';

// 加载模板列表
async function loadTemplates() {
  try {
    const res = await fetch('/api/templates');
    const data = await res.json();
    templates = data.templates || [];
    renderTemplates();
  } catch (e) {
    $('hint').textContent = '模板加载失败：' + e.message;
  }
}

function renderTemplates() {
  const grid = $('tplGrid');
  grid.innerHTML = '';
  templates.forEach(t => {
    const card = document.createElement('div');
    card.className = 'tpl-card' + (t.name === selectedTemplate ? ' active' : '');
    card.dataset.name = t.name;
    card.innerHTML = `
      <img src="${t.image}" alt="${t.description}" loading="lazy" onerror="this.style.display='none'">
      <div class="tpl-name">${t.description}</div>
      <div class="tpl-desc">${getTemplateHint(t.name)}</div>
    `;
    card.addEventListener('click', () => {
      document.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      selectedTemplate = t.name;
    });
    grid.appendChild(card);
  });
}

function getTemplateHint(name) {
  const hints = {
    minimal: '最简单的入门模板，适合快速上手',
    calculator: '加减乘除，随便算',
    todo: '添加、勾选、删除，日常必备',
    'image-filter': '给图片加点特效'
  };
  return hints[name] || '';
}

// Tab 切换
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    tab.classList.add('on');
    const name = tab.dataset.tab;
    $('pane-manifest').style.display = name === 'manifest' ? 'block' : 'none';
    $('pane-source').style.display = name === 'source' ? 'block' : 'none';
  });
});

// 生成
async function generate() {
  const desc = $('desc').value.trim();
  if (!desc) { $('desc').focus(); return; }
  const btn = $('genBtn');
  btn.disabled = true; btn.textContent = '生成中…';
  $('result').classList.remove('show');
  $('status').className = 'status';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc, template: selectedTemplate, build: false })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || '生成失败');

    const m = data.manifest || {};
    const items = [
      ['应用名称', m.name || '-'],
      ['版本', m.version || '-'],
      ['模板', m.template || '-'],
      ['权限', Array.isArray(m.permissions) ? m.permissions.join(', ') || '无' : '无'],
      ['创建时间', m.createdAt || '-']
    ];
    $('manifestMeta').innerHTML = items.map(([k, v]) =>
      `<div class="meta-item"><div class="k">${k}</div><div class="v">${escapeHtml(v)}</div></div>`
    ).join('');

    $('sourceCode').textContent = data.source;
    $('buildMsg').textContent = data.build_result || '已生成，可以继续描述更复杂的应用。';

    const st = $('status');
    st.className = 'status ok';
    st.textContent = '✓ 应用已生成';
    $('result').classList.add('show');
    document.querySelector('.tab[data-tab=manifest]').click();
  } catch (e) {
    const st = $('status');
    st.className = 'status err';
    st.textContent = '✗ ' + e.message;
    $('result').classList.add('show');
    $('pane-manifest').style.display = 'block';
    $('manifestMeta').innerHTML = '';
    $('sourceCode').textContent = '';
  } finally {
    btn.disabled = false; btn.textContent = '✨ 给我生成';
  }
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = String(s);
  return div.innerHTML;
}

$('genBtn').addEventListener('click', generate);
$('desc').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) generate(); });
loadTemplates();
</script>
</body>
</html>
