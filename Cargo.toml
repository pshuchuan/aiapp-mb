[workspace]
resolver = "2"
members = [
    "crates/aiapp-gen",
    "crates/aiapp-build",
    "crates/aiapp-format",
    "crates/aiapp-pack",
    "crates/aiapp-engine",
    "crates/aiapp-host-bridge",
    "crates/aiapp-cli",
    "crates/aiapp-render",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

[profile.release]
strip = true